<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Sistem Informasi - Politeknik Penerbangan Indonesia Curug</title>
    
    <!-- Favicon / Logo Web pada Tab Browser -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1aC-xXpYi5bPon4N5biyockuXwTDcy8Pu">
    
    <!-- Preconnect untuk mempercepat render -->
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #020617;
            margin: 0; padding: 0;
            overflow: hidden;
            color: #f8fafc;
        }

        /* Latar Belakang Asli */
        .bg-custom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background-image: url('https://lh3.googleusercontent.com/d/1I4uQ32h1LN7V1A7NMliGZmw2utljBUXj');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Lapisan gelap transparan */
        .bg-dark-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background-color: rgba(2, 6, 23, 0.75); 
        }

        /* Glassmorphism Premium */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tombol Modern */
        .btn-modern {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-modern:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.4); 
            transform: translateY(-2px);
        }
        .btn-modern:active {
            transform: translateY(1px);
        }

        /* Spinner Futuristik (Tanpa Teks) */
        .spinner-container {
            position: relative;
            width: 50px;
            height: 50px;
        }
        .spinner-ring {
            position: absolute;
            inset: 0;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top-color: #6366f1;
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }
        .spinner-ring-inner {
            position: absolute;
            inset: 8px;
            border: 3px solid rgba(16, 185, 129, 0.15);
            border-bottom-color: #10b981;
            border-radius: 50%;
            animation: spin-reverse 0.7s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes spin-reverse { 0% { transform: rotate(360deg); } 100% { transform: rotate(0deg); } }
    </style>
</head>
<body>

    <div class="bg-custom-overlay"></div>
    <div class="bg-dark-overlay"></div>

    <!-- HALAMAN MENU UTAMA -->
    <div id="halamanMenu" class="min-h-screen flex flex-col items-center justify-center p-6 relative z-10 w-full transition-opacity duration-300">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-sm flex flex-col items-center">
            
            <!-- Logo -->
            <div class="relative w-16 h-16 mb-5 group">
                <div class="absolute inset-0 bg-indigo-500 rounded-full blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>
                <div class="relative w-full h-full bg-[#0f172a] border border-indigo-500/30 rounded-2xl flex items-center justify-center shadow-inner">
                    <img src="https://lh3.googleusercontent.com/d/1aC-xXpYi5bPon4N5biyockuXwTDcy8Pu" alt="Logo" class="h-10 w-auto object-contain">
                </div>
            </div>

            <h1 class="text-xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400 mb-1 text-center">
                PORTAL DIGITAL TARUNA/I
            </h1>
            <p class="text-[10px] font-semibold tracking-widest text-indigo-400/80 uppercase mb-8 text-center">
                Politeknik Penerbangan Indonesia Curug
            </p>

            <div class="w-full space-y-3">
                <!-- Tombol 1: Log Pergerakan -->
                <button onclick="bukaLayanan('pergerakan')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:text-indigo-300 group-hover:scale-110 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200 leading-tight">Log Pergerakan<br>Keluar Masuk Asrama</span>
                    </div>
                </button>

                <!-- Tombol 2: Log Peminjaman Gedung -->
                <button onclick="bukaLayanan('gedung')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:text-emerald-300 group-hover:scale-110 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m3 0h1m-1-4h.01M9 16h.01M9 12h.01M9 8h.01M15 16h.01M15 12h.01M15 8h.01"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200 leading-tight">Log Peminjaman<br>Gedung</span>
                    </div>
                </button>

                <!-- Tombol 3: Log Peminjaman Kendaraan -->
                <button onclick="bukaLayanan('kendaraan')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group opacity-60">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-slate-500/10 border border-slate-500/20 flex items-center justify-center text-slate-400 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200 leading-tight">Log Peminjaman<br>Kendaraan</span>
                        <span class="inline-block text-[9px] text-slate-900 bg-amber-400 font-bold px-1.5 py-0.5 rounded mt-1">COMING SOON</span>
                    </div>
                </button>
            </div>
        </div>
        
        <div class="mt-8 flex items-center gap-2 opacity-50">
            <span class="w-8 h-px bg-slate-600"></span>
            <span class="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase">Korps Taruna</span>
            <span class="w-8 h-px bg-slate-600"></span>
        </div>
    </div>

    <!-- AREA APLIKASI (Iframe) -->
    <div id="layarAplikasi" class="hidden fixed inset-0 z-40 w-full h-full bg-transparent">
        <!-- LAYER SPINNER LOADING -->
        <div id="loadingOverlay" class="absolute inset-0 z-50 flex items-center justify-center bg-[#020617]/70 backdrop-blur-md transition-opacity duration-700 opacity-100">
            <div class="glass-panel p-6 rounded-full flex items-center justify-center shadow-[0_0_40px_rgba(99,102,241,0.15)] border border-white/10 transform scale-110">
                <div class="spinner-container">
                    <div class="spinner-ring"></div>
                    <div class="spinner-ring-inner"></div>
                </div>
            </div>
        </div>

        <div id="iframeWrapper" class="relative w-full h-full z-10"></div>
    </div>

    <script>
        const daftarAplikasi = {
            'pergerakan': 'https://script.google.com/macros/s/AKfycbwaWYSc7chUlWYVBRW15S5ULY2BsJNXafZBZFHSr9B2bdjwxkOVxKQE5vdBz9UK_WSl/exec',
            'gedung': 'https://script.google.com/macros/s/AKfycbwssleg1KigvT6ospk6LVwpea_78W2OuInzvV7GzbNmO9RfaanhQMo2wECICG8Mx8Dv/exec'
        };

        // KUNCI SOLUSI IPHONE: Fungsi deteksi perangkat pintar
        function bukaLayanan(idLayanan) {
            if (!daftarAplikasi[idLayanan]) return;

            // Cek apakah perangkat adalah iPhone/iPad (iOS)
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

            // Jika pengguna pakai iPhone DAN membuka Log Pergerakan (yang butuh izin lokasi GPS)
            if (isIOS && idLayanan === 'pergerakan') {
                // Lewati iframe dan langsung redirect ke link asli agar GPS tidak di-blokir Apple
                window.location.href = daftarAplikasi[idLayanan];
                return;
            }

            // Untuk Android, PC, atau buka Log Gedung: Lanjut menggunakan animasi Iframe portal
            window.location.hash = idLayanan; 
        }

        function tanganiNavigasi() {
            const idLayanan = window.location.hash.substring(1); 
            const layarAplikasi = document.getElementById('layarAplikasi');
            const halamanMenu = document.getElementById('halamanMenu');
            const wrapper = document.getElementById('iframeWrapper');
            const loadingOverlay = document.getElementById('loadingOverlay');
            
            if (daftarAplikasi[idLayanan]) {
                halamanMenu.classList.add('hidden');
                layarAplikasi.classList.remove('hidden');
                
                loadingOverlay.classList.remove('opacity-0', 'pointer-events-none');
                loadingOverlay.classList.add('opacity-100', 'pointer-events-auto');
                
                if (wrapper.dataset.current !== idLayanan) {
                    wrapper.innerHTML = ''; 
                    
                    const iframe = document.createElement('iframe');
                    iframe.setAttribute('allow', 'camera; microphone; geolocation');
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    iframe.style.background = 'transparent';
                    
                    setTimeout(() => {
                        iframe.onload = function() {
                            loadingOverlay.classList.remove('opacity-100');
                            loadingOverlay.classList.add('opacity-0');
                            setTimeout(() => {
                                loadingOverlay.classList.remove('pointer-events-auto');
                                loadingOverlay.classList.add('pointer-events-none');
                            }, 700);
                        };
                        iframe.src = daftarAplikasi[idLayanan];
                    }, 50);
                    
                    wrapper.appendChild(iframe);
                    wrapper.dataset.current = idLayanan;
                } else {
                    setTimeout(() => {
                        loadingOverlay.classList.remove('opacity-100');
                        loadingOverlay.classList.add('opacity-0');
                        setTimeout(() => {
                            loadingOverlay.classList.remove('pointer-events-auto');
                            loadingOverlay.classList.add('pointer-events-none');
                        }, 700);
                    }, 400);
                }
            } else {
                layarAplikasi.classList.add('hidden');
                halamanMenu.classList.remove('hidden');
                
                wrapper.innerHTML = '';
                wrapper.dataset.current = '';
                
                if (window.location.hash !== '') {
                    history.replaceState(null, null, window.location.pathname + window.location.search);
                }
            }
        }

        window.addEventListener('hashchange', tanganiNavigasi);
        window.onload = function() { tanganiNavigasi(); };
    </script>
</body>
</html>
