<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Sistem Informasi - PPI Curug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0e121e;
            margin: 0; padding: 0;
            overflow: hidden;
            touch-action: none;
        }

        /* Latar belakang persis seperti aslinya */
        .bg-custom-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-image: url('https://lh3.googleusercontent.com/d/1I4uQ32h1LN7V1A7NMliGZmw2utljBUXj'); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: blur(2px) brightness(0.5) contrast(1.05);
            transform: scale(1.03);
        }

        /* Container Iframe */
        #iframeContainer {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0; left: 0;
            z-index: 50;
            background-color: #0e121e;
        }
        
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body class="text-slate-100">

    <div class="bg-custom-overlay"></div>

    <!-- HALAMAN MENU -->
    <div id="halamanMenu" class="min-h-screen flex flex-col items-center justify-center p-6 relative z-10 w-full">
        <div class="bg-[#181d30]/80 backdrop-blur-md border border-slate-700/60 p-8 rounded-3xl shadow-2xl w-full max-w-sm text-center">
            <div class="w-16 h-16 mx-auto bg-indigo-500/20 border border-indigo-400/30 rounded-2xl flex items-center justify-center mb-4">
                <img src="https://lh3.googleusercontent.com/d/1aC-xXpYi5bPon4N5biyockuXwTDcy8Pu" alt="Logo" class="h-10 w-auto">
            </div>
            <h1 class="text-lg font-bold text-white tracking-wide uppercase mb-1">Portal Digital</h1>
            <p class="text-xs text-slate-400 mb-8">Politeknik Penerbangan Indonesia Curug</p>

            <div class="space-y-4">
                <!-- Tombol 1: Log Pergerakan -->
                <button onclick="bukaLayanan('pergerakan')" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    Log Pergerakan
                </button>

                <!-- Tombol 2: Peminjaman Gedung -->
                <button onclick="bukaLayanan('gedung')" class="w-full py-3.5 bg-[#1e293b] hover:bg-[#334155] border border-slate-600 text-slate-200 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-lg">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m3 0h1m-1-4h.01M9 16h.01M9 12h.01M9 8h.01M15 16h.01M15 12h.01M15 8h.01"></path></svg>
                    Peminjaman Gedung
                </button>

                <!-- Tombol 3: Log Kendaraan -->
                <button onclick="bukaLayanan('kendaraan')" class="w-full py-3.5 bg-[#1e293b] hover:bg-[#334155] border border-slate-600 text-slate-200 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-lg opacity-75">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    Log Kendaraan (Segera)
                </button>
            </div>
        </div>
        
        <div class="mt-8 text-center text-[10px] text-slate-500 font-semibold uppercase tracking-wider">
            Korps Taruna • Internal
        </div>
    </div>

    <!-- AREA IFRAME (Tampilan Web App Anda) -->
    <div id="iframeContainer">
        <iframe id="mainFrame" src="" allow="camera; microphone; geolocation"></iframe>
    </div>

    <script>
        // Database Link Layanan Anda
        const daftarAplikasi = {
            'pergerakan': 'https://script.google.com/macros/s/AKfycbx88g8w0hOuMYx-wuI5GasZtrjHUW0TRJHuQk4-_7snFUYAhH_gR6yt70LaErwFlfaO/exec',
            'gedung': 'https://script.google.com/macros/s/AKfycbzKqAZLF4CCSWAAjOFfALUeVmwkHfG9fglWyx0RZuppxtaxTwsi59KA9YYOzNfx4fuj/exec'
        };

        // Fungsi yang menangani rute/layar apa yang harus ditampilkan
        function tanganiNavigasi() {
            // Ambil hash dari URL (misal: "pergerakan" dari "website.com/#pergerakan")
            const idLayanan = window.location.hash.substring(1); 
            
            if (daftarAplikasi[idLayanan]) {
                // JIKA HASH VALID: Sembunyikan menu, tampilkan iframe
                document.getElementById('halamanMenu').style.display = 'none';
                
                const iframe = document.getElementById('mainFrame');
                // Hindari reload iframe jika URL-nya sudah sama
                if (iframe.src !== daftarAplikasi[idLayanan]) {
                    iframe.src = daftarAplikasi[idLayanan];
                }
                
                document.getElementById('iframeContainer').style.display = 'block';
            } else {
                // JIKA HASH KOSONG (Kembali ke menu)
                document.getElementById('iframeContainer').style.display = 'none';
                document.getElementById('halamanMenu').style.display = 'flex';
                
                // Matikan iframe agar memori HP lega
                document.getElementById('mainFrame').src = "";
                
                // Bersihkan URL jika ada hash yang tidak valid
                if (window.location.hash !== '') {
                    history.replaceState(null, null, ' ');
                }
            }
        }

        // Sensor ini akan mendeteksi setiap kali gestur "usap ke belakang" atau tombol "Back" HP ditekan
        window.addEventListener('hashchange', tanganiNavigasi);

        // Dieksekusi pertama kali saat website dibuka (atau di-refresh)
        window.onload = function() {
            tanganiNavigasi();
        };

        // Fungsi saat tombol di menu diklik
        function bukaLayanan(idLayanan) {
            if (!daftarAplikasi[idLayanan]) {
                alert('Layanan belum tersedia.');
                return;
            }
            // Ubah URL secara diam-diam (memancing hashchange dan rekam histori)
            window.location.hash = idLayanan; 
        }
    </script>
</body>
</html>
