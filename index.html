<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Sistem Informasi - PPI Curug</title>
    
    <!-- Preconnect untuk mempercepat render Iframe Google -->
    <link rel="preconnect" href="https://script.google.com">
    <link rel="preconnect" href="https://lh3.googleusercontent.com">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #020617;
            margin: 0; padding: 0;
            overflow: hidden;
            touch-action: none;
            color: #f8fafc;
        }

        /* Latar Belakang Asli Tanpa Blur */
        .bg-custom-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -2;
            background-image: url('https://lh3.googleusercontent.com/d/1I4uQ32h1LN7V1A7NMliGZmw2utljBUXj');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Lapisan gelap transparan agar tombol & teks tetap terbaca elegan */
        .bg-dark-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background-color: rgba(2, 6, 23, 0.75); 
        }

        /* Glassmorphism Premium */
        .glass-panel {
            background: rgba(15, 23, 42, 0.5);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tombol Modern - Minimalist dengan Hover Halus */
        .btn-modern {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-modern:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(99, 102, 241, 0.4); 
            transform: translateY(-2px);
        }
        .btn-modern:active {
            transform: translateY(1px);
        }

        /* Container Pembungkus Layar Penuh */
        #layarAplikasi {
            display: none;
            width: 100vw; height: 100vh;
            position: fixed; top: 0; left: 0;
            z-index: 50;
            background-color: #020617; /* Background gelap saat loading */
        }
        
        /* Wadah untuk menanam iframe */
        #iframeWrapper {
            width: 100%; height: 100%;
            position: relative;
            z-index: 10;
        }

        /* Animasi Loading (Anti Blank Screen) */
        #loadingSpinner {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 5;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #6366f1;
            border-radius: 50%;
            width: 32px; height: 32px;
            animation: spin 1s linear infinite;
            margin-bottom: 12px;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Background Asli -->
    <div class="bg-custom-overlay"></div>
    <div class="bg-dark-overlay"></div>

    <!-- HALAMAN MENU UTAMA -->
    <div id="halamanMenu" class="min-h-screen flex flex-col items-center justify-center p-6 relative z-10 w-full">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-sm flex flex-col items-center">
            
            <!-- Logo -->
            <div class="relative w-16 h-16 mb-5 group">
                <div class="absolute inset-0 bg-indigo-500 rounded-full blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>
                <div class="relative w-full h-full bg-[#0f172a] border border-indigo-500/30 rounded-2xl flex items-center justify-center shadow-inner">
                    <img src="https://lh3.googleusercontent.com/d/1aC-xXpYi5bPon4N5biyockuXwTDcy8Pu" alt="Logo" class="h-10 w-auto object-contain">
                </div>
            </div>

            <!-- Tipografi Modern -->
            <h1 class="text-xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400 mb-1">
                PORTAL DIGITAL
            </h1>
            <p class="text-[10px] font-semibold tracking-widest text-indigo-400/80 uppercase mb-8">
                PPI Curug
            </p>

            <div class="w-full space-y-3">
                <!-- Tombol 1: Log Pergerakan -->
                <button onclick="bukaLayanan('pergerakan')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:text-indigo-300 group-hover:scale-110 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200 leading-tight">Log Pergerakan<br>Keluar Masuk Asrama</span>
                    </div>
                </button>

                <!-- Tombol 2: Log Peminjaman Gedung -->
                <button onclick="bukaLayanan('gedung')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:text-emerald-300 group-hover:scale-110 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m3 0h1m-1-4h.01M9 16h.01M9 12h.01M9 8h.01M15 16h.01M15 12h.01M15 8h.01"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200 leading-tight">Log Peminjaman<br>Gedung</span>
                    </div>
                </button>

                <!-- Tombol 3: Log Peminjaman Kendaraan -->
                <button onclick="bukaLayanan('kendaraan')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group opacity-60">
                    <div class="w-10 h-10 shrink-0 rounded-xl bg-slate-500/10 border border-slate-500/20 flex items-center justify-center text-slate-400 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200 leading-tight">Log Peminjaman<br>Kendaraan</span>
                        <span class="inline-block text-[9px] text-slate-800 bg-amber-400 font-bold px-1.5 py-0.5 rounded mt-1">SEGERA</span>
                    </div>
                </button>
            </div>
        </div>
        
        <div class="mt-8 flex items-center gap-2 opacity-50">
            <span class="w-8 h-px bg-slate-600"></span>
            <span class="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase">Korps Taruna</span>
            <span class="w-8 h-px bg-slate-600"></span>
        </div>
    </div>

    <!-- AREA APLIKASI (Tempat Iframe Ditanam) -->
    <div id="layarAplikasi">
        
        <!-- Animasi Loading saat Iframe sedang ditarik dari Google -->
        <div id="loadingSpinner">
            <div class="spinner"></div>
            <span class="text-[10px] font-bold text-slate-400 tracking-widest">MEMUAT LAYANAN...</span>
        </div>

        <!-- Iframe akan di-generate otomatis oleh Javascript di dalam div ini -->
        <div id="iframeWrapper"></div>
    </div>

    <script>
        // Database Link Layanan Anda
        const daftarAplikasi = {
            'pergerakan': 'https://script.google.com/macros/s/AKfycbwaWYSc7chUlWYVBRW15S5ULY2BsJNXafZBZFHSr9B2bdjwxkOVxKQE5vdBz9UK_WSl/exec',
            'gedung': 'https://script.google.com/macros/s/AKfycbz99rshO2fyWlgj9hCG-Yfn21AFNXPShnuiBZx2c0CIQ64SiDzBJcE_hTA8ueB8vZ9H/exec'
        };

        // Fungsi Inti Navigasi Cerdas
        function tanganiNavigasi() {
            const idLayanan = window.location.hash.substring(1); 
            const layarAplikasi = document.getElementById('layarAplikasi');
            const halamanMenu = document.getElementById('halamanMenu');
            const wrapper = document.getElementById('iframeWrapper');
            
            if (daftarAplikasi[idLayanan]) {
                // Sembunyikan Menu
                halamanMenu.style.display = 'none';
                
                // Jika aplikasi belum dimuat
                if (wrapper.dataset.current !== idLayanan) {
                    wrapper.innerHTML = ''; 
                    
                    const iframe = document.createElement('iframe');
                    iframe.setAttribute('allow', 'camera; microphone; geolocation');
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    // Trik agar saat iframe selesai meload background putih dari Google, loadingnya tertutup otomatis
                    iframe.style.position = 'relative'; 
                    iframe.style.zIndex = '10';
                    
                    wrapper.appendChild(iframe);
                    
                    // Muat url
                    iframe.contentWindow.location.replace(daftarAplikasi[idLayanan]);
                    wrapper.dataset.current = idLayanan;
                }
                
                // Tampilkan Layar Aplikasi (Akan langsung menampilkan loading animasi selagi iframe me-render)
                layarAplikasi.style.display = 'block';
                
            } else {
                // JIKA USER SWIPE BACK (KEMBALI KE MENU)
                layarAplikasi.style.display = 'none';
                halamanMenu.style.display = 'flex';
                
                // HANCURKAN Iframe 
                wrapper.innerHTML = '';
                wrapper.dataset.current = '';
                
                // Bersihkan histori URL HP agar bersih tanpa tanda '#'
                if (window.location.hash !== '') {
                    history.replaceState(null, null, window.location.pathname + window.location.search);
                }
            }
        }

        window.addEventListener('hashchange', tanganiNavigasi);

        window.onload = function() {
            tanganiNavigasi();
        };

        function bukaLayanan(idLayanan) {
            if (!daftarAplikasi[idLayanan]) return;
            window.location.hash = idLayanan; 
        }
    </script>
</body>
</html>
