<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Portal Sistem Informasi - PPI Curug</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        body { 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #020617;
            margin: 0; padding: 0;
            overflow: hidden;
            touch-action: none;
            color: #f8fafc;
        }

        /* Latar Belakang Modern (Subtle Glow / Cahaya Halus) */
        .bg-glow {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: 
                radial-gradient(circle at 15% 0%, rgba(79, 70, 229, 0.12) 0%, transparent 40%), 
                radial-gradient(circle at 85% 100%, rgba(56, 189, 248, 0.08) 0%, transparent 40%);
        }

        /* Glassmorphism Premium */
        .glass-panel {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Tombol Modern - Minimalist dengan Hover Halus */
        .btn-modern {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-modern:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(99, 102, 241, 0.4); 
            transform: translateY(-2px);
        }
        .btn-modern:active {
            transform: translateY(1px);
        }

        /* Container Pembungkus Layar Penuh */
        #layarAplikasi {
            display: none;
            width: 100vw; height: 100vh;
            position: fixed; top: 0; left: 0;
            z-index: 50;
            background-color: #020617;
        }
        
        /* Wadah untuk menanam iframe (Generated by Javascript) */
        #iframeWrapper {
            width: 100%; height: 100%;
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <!-- HALAMAN MENU UTAMA -->
    <div id="halamanMenu" class="min-h-screen flex flex-col items-center justify-center p-6 relative z-10 w-full">
        <div class="glass-panel p-8 rounded-3xl w-full max-w-sm flex flex-col items-center">
            
            <!-- Logo dengan Glow Halus -->
            <div class="relative w-16 h-16 mb-5 group">
                <div class="absolute inset-0 bg-indigo-500 rounded-full blur-xl opacity-20 group-hover:opacity-40 transition-opacity duration-500"></div>
                <div class="relative w-full h-full bg-[#0f172a] border border-indigo-500/30 rounded-2xl flex items-center justify-center shadow-inner">
                    <img src="https://lh3.googleusercontent.com/d/1aC-xXpYi5bPon4N5biyockuXwTDcy8Pu" alt="Logo" class="h-10 w-auto object-contain">
                </div>
            </div>

            <!-- Tipografi Modern -->
            <h1 class="text-xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-slate-100 to-slate-400 mb-1">
                PORTAL DIGITAL
            </h1>
            <p class="text-[10px] font-semibold tracking-widest text-indigo-400/80 uppercase mb-8">
                PPI Curug
            </p>

            <div class="w-full space-y-3">
                <!-- Tombol 1: Log Pergerakan -->
                <button onclick="bukaLayanan('pergerakan')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group">
                    <div class="w-10 h-10 rounded-xl bg-indigo-500/10 border border-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:text-indigo-300 group-hover:scale-110 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200">Log Pergerakan</span>
                        <span class="block text-[10px] text-slate-500 font-medium mt-0.5">Sistem Presensi Asrama</span>
                    </div>
                </button>

                <!-- Tombol 2: Peminjaman Gedung -->
                <button onclick="bukaLayanan('gedung')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group">
                    <div class="w-10 h-10 rounded-xl bg-emerald-500/10 border border-emerald-500/20 flex items-center justify-center text-emerald-400 group-hover:text-emerald-300 group-hover:scale-110 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m3 0h1m-1-4h.01M9 16h.01M9 12h.01M9 8h.01M15 16h.01M15 12h.01M15 8h.01"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200">Peminjaman Gedung</span>
                        <span class="block text-[10px] text-slate-500 font-medium mt-0.5">SAMS, GSG, Auditorium</span>
                    </div>
                </button>

                <!-- Tombol 3: Log Kendaraan (Segera) -->
                <button onclick="bukaLayanan('kendaraan')" class="btn-modern w-full p-4 rounded-2xl flex items-center gap-4 text-left group opacity-60">
                    <div class="w-10 h-10 rounded-xl bg-slate-500/10 border border-slate-500/20 flex items-center justify-center text-slate-400 transition-all">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>
                    </div>
                    <div>
                        <span class="block text-sm font-bold text-slate-200">Log Kendaraan</span>
                        <span class="inline-block text-[9px] text-slate-800 bg-amber-400 font-bold px-1.5 py-0.5 rounded mt-0.5">SEGERA</span>
                    </div>
                </button>
            </div>
        </div>
        
        <div class="mt-8 flex items-center gap-2 opacity-50">
            <span class="w-8 h-px bg-slate-600"></span>
            <span class="text-[9px] font-bold tracking-[0.2em] text-slate-400 uppercase">Korps Taruna</span>
            <span class="w-8 h-px bg-slate-600"></span>
        </div>
    </div>

    <!-- AREA APLIKASI (Tempat Iframe Ditanam) -->
    <div id="layarAplikasi">
        <!-- Iframe akan di-generate otomatis oleh Javascript di dalam div ini -->
        <div id="iframeWrapper"></div>
    </div>

    <script>
        // Database Link Layanan Anda
        const daftarAplikasi = {
            'pergerakan': 'https://script.google.com/macros/s/AKfycbx88g8w0hOuMYx-wuI5GasZtrjHUW0TRJHuQk4-_7snFUYAhH_gR6yt70LaErwFlfaO/exec',
            'gedung': 'https://script.google.com/macros/s/AKfycbzKqAZLF4CCSWAAjOFfALUeVmwkHfG9fglWyx0RZuppxtaxTwsi59KA9YYOzNfx4fuj/exec'
        };

        // Fungsi Inti Navigasi Cerdas (Anti Iframe-History Hijack)
        function tanganiNavigasi() {
            const idLayanan = window.location.hash.substring(1); 
            const layarAplikasi = document.getElementById('layarAplikasi');
            const halamanMenu = document.getElementById('halamanMenu');
            const wrapper = document.getElementById('iframeWrapper');
            
            if (daftarAplikasi[idLayanan]) {
                // Sembunyikan Menu
                halamanMenu.style.display = 'none';
                
                // Cek apakah web app tersebut sudah terbuka
                if (wrapper.dataset.current !== idLayanan) {
                    // 1. Bersihkan iframe lama sepenuhnya
                    wrapper.innerHTML = ''; 
                    
                    // 2. Buat iframe baru
                    const iframe = document.createElement('iframe');
                    iframe.setAttribute('allow', 'camera; microphone; geolocation');
                    iframe.style.width = '100%';
                    iframe.style.height = '100%';
                    iframe.style.border = 'none';
                    wrapper.appendChild(iframe);
                    
                    // 3. TRIK EMAS: Gunakan replace() agar iframe tidak mencetak histori di HP
                    iframe.contentWindow.location.replace(daftarAplikasi[idLayanan]);
                    
                    // Catat layanan yang sedang aktif
                    wrapper.dataset.current = idLayanan;
                }
                
                // Tampilkan Layar Aplikasi
                layarAplikasi.style.display = 'block';
                
            } else {
                // JIKA USER SWIPE BACK (KEMBALI KE MENU)
                layarAplikasi.style.display = 'none';
                halamanMenu.style.display = 'flex';
                
                // HANCURKAN Iframe agar tidak bocor memori dan menghindari blank screen di masa depan
                wrapper.innerHTML = '';
                wrapper.dataset.current = '';
                
                // Bersihkan histori URL HP agar bersih tanpa tanda '#'
                if (window.location.hash !== '') {
                    history.replaceState(null, null, window.location.pathname + window.location.search);
                }
            }
        }

        // Sensor pendeteksi Gestur Swipe Back / Tombol Kembali di HP
        window.addEventListener('hashchange', tanganiNavigasi);

        // Dieksekusi saat web dibuka atau direfresh
        window.onload = function() {
            tanganiNavigasi();
        };

        // Fungsi klik tombol menu
        function bukaLayanan(idLayanan) {
            if (!daftarAplikasi[idLayanan]) return;
            // Menambahkan jejak navigasi (#pergerakan) agar tombol Back HP berfungsi
            window.location.hash = idLayanan; 
        }
    </script>
</body>
</html>
